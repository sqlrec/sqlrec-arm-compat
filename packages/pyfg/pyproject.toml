[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfg"
version = "1.0.5.post3"
description = "SQLREC ARM-compatible subset of pyfg"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.26.4",
  "pyarrow==17.0.0",
  "cityhash==0.4.10",
]

[tool.setuptools.packages.find]
where = ["src"]
