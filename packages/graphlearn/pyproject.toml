[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphlearn"
version = "1.3.8.post1"
description = "SQLREC ARM import-only graphlearn subset"
requires-python = ">=3.11,<3.13"
dependencies = ["pyfg==1.0.5.post1"]

[tool.setuptools.packages.find]
where = ["src"]
